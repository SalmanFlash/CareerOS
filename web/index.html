<!doctype html>
<html lang="ur-Latn"><head>
<meta charset="utf-8"><base href="$FLUTTER_BASE_HREF">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080611"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="CareerOS personal career planner">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>CareerOS</title><style>html,body{background:#080611;color:#f7f2ff;font:18px system-ui}#boot{position:absolute;inset:44% 0 auto;text-align:center}</style></head>
<body><div id="boot">CareerOS</div><script>
window.addEventListener('flutter-first-frame',()=>document.querySelector('#boot')?.remove());
window.careerosOfflineStatus = 'loading';
if ('serviceWorker' in navigator) window.addEventListener('load',async()=>{
  try {
    const registration = await navigator.serviceWorker.register('offline.js');
    const installing = registration.installing;
    installing?.addEventListener('statechange',()=>{
      if (installing.state === 'redundant' && !registration.active) window.careerosOfflineStatus = 'unavailable';
    });
    await navigator.serviceWorker.ready;
    window.careerosOfflineStatus = 'ready';
  } catch { window.careerosOfflineStatus = 'unavailable'; }
});
else window.careerosOfflineStatus = 'unavailable';
</script><script src="flutter_bootstrap.js" async></script></body></html>
